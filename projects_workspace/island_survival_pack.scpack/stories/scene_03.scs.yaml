# 第 3 幕 · 海平线上的微光与六人大团圆
id: scene_03
title: "第 3 幕 · 海平线上的微光与六人大团圆"
bg: "00377"
bgm: "002"
cast: ["amana", "hana", "mano", "hiori", "meguru", "tenka"]
lines:
  - speaker: "プロデューサー"
    emotion: "serious"
    text: "（救援艇沿海岸线搜寻——みんなの様子を確かめながら、声をかけた）"
    zh: "（救援艇沿海岸线搜寻——一边确认大家的状态，一边上前搭话）"
    note: "[小段 1: 救援艇沿海岸线搜寻] 另一边，真乃、灯织、巡与甜花跟随搜救人员乘救援艇在海面巡查。灯织率先发现"
  - speaker: "真乃"
    charLabel: "mano"
    emotion: "surp"
    text: "ほわぁ……！プロデューサーさん、あそこを見てくださいっ！灯織ちゃん、めぐるちゃん、見えましたよ！"
    zh: "哇啊……！制作人先生，请看那边！灯织酱、缭酱，看到大家了哦！"
  - speaker: "灯織"
    charLabel: "hiori"
    emotion: "serious"
    text: "プロデューサー、救命具と飲料水の確認は済んでいます。真乃、めぐる、すぐに体調を確かめましょう。"
    zh: "制作人，救生衣和饮用水的清点已经完成了。真乃、缭，立刻确认大家的身体状况吧。"
  - speaker: "めぐる"
    charLabel: "meguru"
    emotion: "joy"
    text: "おーいっ！プロデューサー！真乃、灯織、見て見て！わたしたちの声、ちゃんと向こうまで届いてるよっ！"
    zh: "喂——！制作人！真乃、灯织，快看快看！我们的声音已经稳稳传到对面去了哦！"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "shy"
    text: "えへへ、日差しが眩しいかも……でもプロデューサーさんが隣なら、甘奈ぜんぜん平気だよ☆"
    zh: "嘿嘿，阳光有点刺眼呢……不过有制作人先生在身边，甘奈完全没问题哦☆"
    note: "[小段 2: 发现海平线救援光束] 海平线上出现救援艇的探照灯光，羽那最先察觉并兴奋地跑向浅滩挥舞手电。甘奈"
  - speaker: "羽那"
    charLabel: "hana"
    emotion: "surp"
    text: "えっ、ほんとですか！？ さすがプロデューサーさんです！あたしもいーっぱいお手伝いしちゃいますね！"
    zh: "咦，真的吗！？不愧是制作人先生！我也要帮大家好多好多的忙哦！"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "idol"
    text: "うんっ☆ どんなことがあっても、甘奈たちなら最高の思い出にできるよね、プロデューサーさん♪"
    zh: "嗯☆ 不管遇到什么突发状况，只要是甘奈我们，一定能变成最棒的回忆对吧，制作人先生♪"
    note: "[小段 3: 抢滩汇合与姐妹重逢] 救援艇停稳后，甜花第一时间小步跑向甘奈确认她没有受伤，真乃、灯织与巡也围"
  - speaker: "羽那"
    charLabel: "hana"
    emotion: "idol"
    text: "えへへ、プロデューサーさんが笑ってくれると、あたしまでぽかぽかしちゃいます！一緒に頑張りましょうね！"
    zh: "嘿嘿，看到制作人先生笑起来，连我心里也暖洋洋的呢！我们一起加油吧！"
  - speaker: "真乃"
    charLabel: "mano"
    emotion: "joy"
    text: "えへへ、みんなの声が重なって、わたしの胸まであたたかくなりますっ。ありがとうございます、プロデューサーさん！"
    zh: "嘿嘿，大家的声音重叠在一起，连我的心里都变得暖洋洋的。谢谢您，制作人先生！"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "idol"
    text: "うんっ☆ どんなことがあっても、甘奈たちなら最高の思い出にできるよね、プロデューサーさん♪"
    zh: "嗯☆ 不管遇到什么突发状况，只要是甘奈我们，一定能变成最棒的回忆对吧，制作人先生♪"
    note: "[小段 4: 星空海平线六人合影] 登船返航前，巡提议大家难得在无人岛齐聚，不如趁着星空海景拍一张纪念合照。"
  - speaker: "羽那"
    charLabel: "hana"
    emotion: "idol"
    text: "えへへ、プロデューサーさんが笑ってくれると、あたしまでぽかぽかしちゃいます！一緒に頑張りましょうね！"
    zh: "嘿嘿，看到制作人先生笑起来，连我心里也暖洋洋的呢！我们一起加油吧！"
  - speaker: "真乃"
    charLabel: "mano"
    emotion: "joy"
    text: "えへへ、みんなの声が重なって、わたしの胸まであたたかくなりますっ。ありがとうございます、プロデューサーさん！"
    zh: "嘿嘿，大家的声音重叠在一起，连我的心里都变得暖洋洋的。谢谢您，制作人先生！"
