# christmas-eve-v5
id: scene_01
title: "christmas-eve-v5"
bg: "00226"
bgm: "002"
cast: ["mikoto", "nichika"]
lines:
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……六點四十。\n晚了十分鐘。"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "連個訊息也沒有。"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "算了。\n也不是第一天認識她。"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "（手，很冰。）"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "（口袋裡的暖暖包，\n還剩一個。）"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "美琴小姐！\n對、對不起……！"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "電車、那個……\n誤點了……"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……嗯。\n我也剛到。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "真的嗎……？\n……嘿嘿。"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "那是什麼。\n盒子。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "啊，這個……\n是蛋糕！"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "因為是聖誕夜……\n想說，兩個人一起吃……"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……兩個人。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "……不行嗎。"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "沒有不行。\n謝謝。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "哇……！\n好厲害，全部都在發光……！"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "每年都一樣。\n一樣的燈，一樣的街道。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "才不是每年！\n今年，我是第一次……！"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……也對。\n來的人不一樣。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "……咦？"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "所以，大概不算一樣吧。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "……美琴小姐，\n好像老師喔。"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "是嗎。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "美琴小姐每年\n都會來看嗎？"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……沒看。\n只是路過。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "那今天就是第一次！\n跟我一樣……！"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……\n……是啊。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "啊，聖誕樹！\n來拍照吧，美琴小姐……"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……人很多。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "馬上就好！\n來，笑一個……！"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "不笑。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "那我一個人拍！"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……那張，我也會入鏡吧。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "當然！\n不是兩個人，就沒意義了……！"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "拍好了！\n你看，很漂亮吧……"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……嗯。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "啊，傳給露卡小姐吧！"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "現在？"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "現在！\n就說「今天是聖誕節」……！"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……傳了。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "好快……"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "反正之後也會被念。\n先說比較省事。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "……嘿嘿，也對。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "啊，那個人，在唱歌呢。"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "音準，有點危險。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "可是，很溫暖……"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……是啊。\n比準確還難的東西。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "……？"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "沒什麼。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "美琴小姐也要唱嗎！"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "不唱。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "秒答……！？"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "不在人前，突然唱歌。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "那我一個人唱……"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "太冷了。\n聲音出不來。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "……也對喔。"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "……你的手，紅了。"
  - speaker: "日花"
    kind: "dialogue"
    charLabel: "nichika"
    text: "咦？\n啊……真的耶……"
  - speaker: "美琴"
    kind: "dialogue"
    charLabel: "mikoto"
    text: "那邊有開。\n便利商店。"
