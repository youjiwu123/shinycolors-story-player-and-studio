# ⚡ 当偶像们听到「我们只是制作人和偶像的关系」时的反应合集
id: scene_01_reactions
title: "⚡ 当偶像们听到「我们只是制作人和偶像的关系」时的反应合集"
bg: "00001"
bgm: "0028"
cast: ["mano", "hiori", "meguru", "kogane", "mamimi", "sakuya", "yuika", "kiriko", "kaho", "chiyoko", "juri", "rinze", "natsuha", "amana", "tenka", "chiyuki", "asahi", "fuyuko", "mei", "tooru", "madoka", "koito", "hinana", "nichika", "mikoto", "luca", "hana", "haruki"]
lines:
  - speaker: "プロデューサー"
    kind: "dialogue"
    emotion: "joy"
    text: "「プロデューサーとアイドル、それ以上でも以下でもない関係だろ？」"
    zh: "（我们只是制作人和偶像的关系，仅此而已吧？）"
    note: "[命题台词] 对 黛冬优子 提问"
  - speaker: "冬優子"
    kind: "dialogue"
    charLabel: "fuyuko"
    emotion: "idol"
    charPosition: "[object Object]"
    text: "ふふっ、プロデューサーさんったら、急に何を言い出すのかしら♡"
    zh: "呵呵，制作人先生真是的，怎么突然说出这种话呀♡"
    note: "[初反应] 营业模式完美甜笑"
  - speaker: "冬優子"
    kind: "dialogue"
    charLabel: "fuyuko"
    emotion: "tsun"
    bgm: "off"
    charPosition: "[object Object]"
    text: "……はあ！？それ以上でも以下でもないって、ふゆを誰だと思ってるのよ！"
    zh: "……哈啊！？什么叫仅此而已，你把冬优当成什么人了啊！"
    note: "[反转破防] BGM骤停 · 瞬间切回裏冬优子逼近一步"
  - speaker: "冬優子"
    kind: "dialogue"
    charLabel: "fuyuko"
    emotion: "shy"
    se: "0453"
    charPosition: "[object Object]"
    text: "あんたの一番近くにいるのはふゆなんだから、絶対によそ見しないでよね……っ！"
    zh: "离你最近的明明是冬优我，绝对不准你把视线移向别人哦……！"
    note: "[直球收尾] 脸颊微红别过视线宣示主权"
  - speaker: "プロデューサー"
    kind: "dialogue"
    emotion: "joy"
    text: "「プロデューサーとアイドル、それ以上でも以下でもない関係だろ？」"
    zh: "（我们只是制作人和偶像的关系，仅此而已吧？）"
    note: "[命题台词] 对 樋口圆香 提问"
  - speaker: "円香"
    kind: "dialogue"
    charLabel: "madoka"
    emotion: "serious"
    charPosition: "[object Object]"
    text: "ええ、そうですね。プロデューサーとアイドル、ただのビジネスパートナーですから。"
    zh: "嗯，是那样没错呢。制作人和偶像，本来就只是纯粹的商业搭档而已。"
    note: "[初反应] 波澜不惊地冷淡附和"
  - speaker: "円香"
    kind: "dialogue"
    charLabel: "madoka"
    emotion: "sigh"
    bgm: "off"
    charPosition: "[object Object]"
    text: "……わざわざ口に出して線を引くなんて、プロデューサー、何か後ろめたいことでも？"
    zh: "……特意说出口来划清界限，制作人，您是有什么心虚的事吗？"
    note: "[反转刺探] 半眯起眼冷冷盯住制作人"
  - speaker: "円香"
    kind: "dialogue"
    charLabel: "madoka"
    emotion: "shy"
    charPosition: "[object Object]"
    text: "ふーん……まあ、わたしは最初から期待なんてしていませんけど。"
    zh: "哼……算了，反正我从一开始就没有抱什么多余的期待就是了。"
    note: "[余韵收尾] 微微移开目光轻声嘟囔"
  - speaker: "プロデューサー"
    kind: "dialogue"
    emotion: "joy"
    text: "「プロデューサーとアイドル、それ以上でも以下でもない関係だろ？」"
    zh: "（我们只是制作人和偶像的关系，仅此而已吧？）"
    note: "[命题台词] 对 大崎甘奈 提问"
  - speaker: "甘奈"
    kind: "dialogue"
    charLabel: "amana"
    emotion: "surp"
    charPosition: "[object Object]"
    text: "えっ……？プロデューサーさん、急にそんなこと言われたら、甘奈びっくりしちゃうよ……？"
    zh: "咦……？制作人先生，突然说这种话，甘奈会被吓一跳的哦……？"
    note: "[初反应] 笑容僵在脸上眨了眨眼"
  - speaker: "甘奈"
    kind: "dialogue"
    charLabel: "amana"
    emotion: "sad"
    se: "0453"
    charPosition: "[object Object]"
    text: "そんなのやだぁ……甘奈にとってプロデューサーさんは、ただの仕事相手なんかじゃないもん……。"
    zh: "甘奈才不要那样呢……对甘奈来说，制作人先生才不是普通的工作对象嘛……。"
    note: "[反转破防] 眼眶微润拉住制作人袖角"
  - speaker: "甘奈"
    kind: "dialogue"
    charLabel: "amana"
    emotion: "joy"
    se: "0478"
    charPosition: "[object Object]"
    text: "えへへ、今のなしっ☆ 甘奈はプロデューサーさんと、もっと特別な関係でいたいな♪"
    zh: "嘿嘿，刚才那句不算数☆ 甘奈想和制作人先生保持更加特别的关系呢♪"
    note: "[直球暴击] 贴近一步露出灿烂笑容"
  - speaker: "プロデューサー"
    kind: "dialogue"
    emotion: "joy"
    text: "「プロデューサーとアイドル、それ以上でも以下でもない関係だろ？」"
    zh: "（我们只是制作人和偶像的关系，仅此而已吧？）"
    note: "[命题台词] 对 大崎甜花 提问"
  - speaker: "甜花"
    kind: "dialogue"
    charLabel: "tenka"
    emotion: "surp"
    charPosition: "[object Object]"
    text: "あ、あの……プロデューサーさん、甜花のこと、迷惑になっちゃった……？"
    zh: "那、那个……制作人先生，是不是甜花平时太添麻烦，让您讨厌了……？"
    note: "[初反应] 慌慌张张地捏紧手指"
  - speaker: "甜花"
    kind: "dialogue"
    charLabel: "tenka"
    emotion: "sad"
    bgm: "off"
    charPosition: "[object Object]"
    text: "うぅ……ただの関係だなんて言われたら、甜花、寂しくて泣いちゃいそう……。"
    zh: "呜呜……要是被说只是普通关系的话，甜花会因为太寂寞哭出来的……。"
    note: "[反转破防] 低着头声音越来越小"
  - speaker: "甜花"
    kind: "dialogue"
    charLabel: "tenka"
    emotion: "joy"
    se: "0478"
    charPosition: "[object Object]"
    text: "にへへ……冗談でよかったぁ……甜花、これからもプロデューサーさんの傍がいいな……。"
    zh: "嘿嘿……原来是开玩笑真是太好啦……甜花以后也想一直待在制作人先生身边呢……。"
    note: "[安心依赖] 破涕为笑轻轻靠过来"
  - speaker: "プロデューサー"
    kind: "dialogue"
    emotion: "joy"
    text: "「プロデューサーとアイドル、それ以上でも以下でもない関係だろ？」"
    zh: "（我们只是制作人和偶像的关系，仅此而已吧？）"
    note: "[命题台词] 对 铃木羽那 提问"
  - speaker: "羽那"
    kind: "dialogue"
    charLabel: "hana"
    emotion: "surp"
    charPosition: "[object Object]"
    text: "えっ……？プロデューサーさん、急にかしこまってどうしちゃったんですか？"
    zh: "咦……？制作人先生，怎么突然这么一本正经呀？"
    note: "[初反应] 纯真地歪了歪脑袋"
  - speaker: "羽那"
    kind: "dialogue"
    charLabel: "hana"
    emotion: "joy"
    se: "0453"
    charPosition: "[object Object]"
    text: "あたしにとっては、プロデューサーさんは世界で一番特別なプロデューサーさんですよ～！"
    zh: "但在我心里，制作人先生就是全世界最最特别的制作人先生哦～！"
    note: "[直球暴击] 毫无防备的零距离天然直球"
  - speaker: "羽那"
    kind: "dialogue"
    charLabel: "hana"
    emotion: "idol"
    se: "0478"
    charPosition: "[object Object]"
    text: "えへへ、これからもずーっと、あたしの隣で見ててくださいね、プロデューサーさんっ！"
    zh: "嘿嘿，今后也请一直一直留在我的身边注视着我哦，制作人先生！"
    note: "[甜度拉满] 双眼发亮地开心挥手"
  - speaker: "プロデューサー"
    kind: "dialogue"
    emotion: "joy"
    text: "「プロデューサーとアイドル、それ以上でも以下でもない関係だろ？」"
    zh: "（我们只是制作人和偶像的关系，仅此而已吧？）"
    note: "[命题台词] 对 斑鸠路加 提问"
  - speaker: "ルカ"
    kind: "dialogue"
    charLabel: "luca"
    emotion: "tsun"
    charPosition: "[object Object]"
    text: "……は？プロデューサー、今さら何当たり前のこと言ってんだよ。"
    zh: "……哈？制作人，都这时候了你还在说什么理所当然的废话啊。"
    note: "[初反应] 皱眉冷笑一声"
  - speaker: "ルカ"
    kind: "dialogue"
    charLabel: "luca"
    emotion: "serious"
    bgm: "off"
    charPosition: "[object Object]"
    text: "勝手に線引きしてんじゃねェよ……あたしはアンタのお人形じゃねェんだからな。"
    zh: "少在那里擅自划清界限了……我可不是任你摆布的洋娃娃。"
    note: "[反转凌厉] 眼神锋利地逼视制作人"
  - speaker: "ルカ"
    kind: "dialogue"
    charLabel: "luca"
    emotion: "sigh"
    charPosition: "[object Object]"
    text: "……チッ、いいから黙ってあたしのステージだけ見てろよ、プロデューサー。"
    zh: "……啧，少啰嗦，你就闭上嘴乖乖只看着我的舞台就够了，制作人。"
    note: "[傲娇独占] 压低帽檐转过身去"
  - speaker: "プロデューサー"
    kind: "dialogue"
    emotion: "joy"
    text: "「プロデューサーとアイドル、それ以上でも以下でもない関係だろ？」"
    zh: "（我们只是制作人和偶像的关系，仅此而已吧？）"
    note: "[命题台词] 对 樱木真乃 提问"
  - speaker: "真乃"
    kind: "dialogue"
    charLabel: "mano"
    emotion: "surp"
    charPosition: "[object Object]"
    text: "ほわっ……！？プ、プロデューサーさん、なんだか少し寂しい言い方ですね……。"
    zh: "哇啊……！？制、制作人先生，您这么说总觉得有一点点寂寞呢……。"
    note: "[初反应] 微微睁大眼睛面露寂寞"
  - speaker: "真乃"
    kind: "dialogue"
    charLabel: "mano"
    emotion: "shy"
    se: "0453"
    charPosition: "[object Object]"
    text: "あの……たしかにプロデューサーさんとアイドルですけど、それだけじゃない気がしますっ。"
    zh: "那个……虽然确实是制作人先生和偶像的关系，但我总觉得并不止如此哦。"
    note: "[鼓起勇气] 双手贴在胸前认真望向制作人"
  - speaker: "真乃"
    kind: "dialogue"
    charLabel: "mano"
    emotion: "joy"
    se: "0478"
    charPosition: "[object Object]"
    text: "えへへ、わたしはプロデューサーさんと一緒に歩める毎日が、一番の宝物なんですっ。"
    zh: "嘿嘿，能和制作人先生一起并肩前行的每一天，就是我最珍贵的宝物呀。"
    note: "[治愈直球] 春风般温暖的笑容"
  - speaker: "プロデューサー"
    kind: "dialogue"
    emotion: "joy"
    text: "「プロデューサーとアイドル、それ以上でも以下でもない関係だろ？」"
    zh: "（我们只是制作人和偶像的关系，仅此而已吧？）"
    note: "[命题台词] 对 七草日花 提问"
  - speaker: "にちか"
    kind: "dialogue"
    charLabel: "nichika"
    emotion: "idol"
    charPosition: "[object Object]"
    text: "あーはっは！プロデューサーさん、急にマジメな顔してどうしたんですかー！？"
    zh: "啊哈哈！制作人先生，怎么突然摆出一副严肃的脸吓人呀——！？"
    note: "[初反应] 勉强摆手大笑试图糊弄过去"
  - speaker: "にちか"
    kind: "dialogue"
    charLabel: "nichika"
    emotion: "sad"
    bgm: "off"
    charPosition: "[object Object]"
    text: "……え、ちょっと待ってください。それって、私を見捨てる前振りじゃないですよね……？"
    zh: "……咦，请等一下。您这么说，该不会是准备丢下不管我的铺垫吧……？"
    note: "[反转破防] BGM骤停 · 笑容瞬间消失声音发颤"
  - speaker: "にちか"
    kind: "dialogue"
    charLabel: "nichika"
    emotion: "tsun"
    se: "0453"
    charPosition: "[object Object]"
    text: "やだ、絶対離れませんからね！プロデューサーさんは私のプロデューサーさんなんですからっ！"
    zh: "我才不要，我绝对不会放手的哦！因为制作人先生可是我的制作人先生啊！"
    note: "[重女死守] 紧紧抓住制作人袖口不放"
