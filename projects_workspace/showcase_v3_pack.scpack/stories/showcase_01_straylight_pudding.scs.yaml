# 第一幕：休息室的布丁悬案
id: showcase_01_straylight_pudding
title: "第一幕：休息室的布丁悬案"
bg: "00001"
bgm: "005"
cast: ["fuyuko", "asahi", "mei"]
lines:
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "idol"
    text: "あ、プロデューサーさんっ！ ふゆ、みんなの分のスイーツを買ってきちゃいました♡"
    zh: "啊，制作人先生！冬优连大家的份一起把甜点买回来了哦♡"
    note: "冬优子甜美营业开场"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "joy"
    text: "わあ、さすが冬優子ちゃんっ！ めっちゃ美味しそうじゃん！"
    zh: "哇，不愧是冬优子！看起来也太好吃了吧！"
    note: "爱依开心捧场"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "joy"
    text: "あ、本当っすね！ でもあたし、冷蔵庫の奥にもっとすごいプリン見つけたっす！"
    zh: "啊，真的耶！不过我在冰箱最里面发现了看起来更厉害的布丁！"
    note: "朝日好奇凑近冰箱"
  - speaker: ""
    text: ""
    note: "朝日拎着布丁盒子横向走到舞台中央展示"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "surp"
    text: "これっす！ 金色のシールが貼ってあって、限定一個って書いてあるっすよ！"
    zh: "就是这个！上面还贴着金色贴纸，写着限定最后一份呢！"
    note: "朝日举起金色限定布丁"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "surp"
    text: "えっ……？ あ、あさひちゃん、今なんて言いましたの……？"
    zh: "诶……？朝、朝日，你刚才说的是什么……？"
    note: "冬优子笑容僵住"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "tsun"
    text: "ちょっと待ちなさいよ、あさひ！ それはあとで食べる用に隠しておいた限定品なんだけど！？"
    zh: "你给我等一下啊，朝日！那可是我偷偷藏起来打算晚点吃的限定款好吗！？"
    note: "冬优子瞬间切回本音吐槽"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "joy"
    text: "あはは、冬優子ちゃんったら顔がいつもの本気モードになってるってば～"
    zh: "啊哈哈，冬优子你表情一下切回平时认真模式啦～"
    note: "爱依笑著打圆场"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "joy"
    text: "じゃあ、半分こにすれば問題解決っすね！ スプーン二つ持ってきたっすよ！"
    zh: "那咱们一人一半不就解决啦！我把两把勺子都拿来啰！"
    note: "朝日爽快递出勺子"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "sigh"
    text: "……もう、調子狂うんだから。……仕方ないわね、仲良く分けてあげるわよ"
    zh: "……真是的，节奏全被你打乱了。……真拿你没办法，就和你们分着吃吧。"
    note: "冬优子叹气妥协"
