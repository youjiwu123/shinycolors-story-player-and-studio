# 第二幕：暮色风起时的四重奏
id: showcase_02_rooftop_sunset
title: "第二幕：暮色风起时的四重奏"
bg: "00017"
bgm: "0082"
cast: ["tooru", "madoka", "koito", "hinana"]
lines:
  - speaker: "透"
    charLabel: "tooru"
    emotion: "serious"
    text: "……あー、風、冷たくなってきた。夕焼け、なんかすごい色だね"
    zh: "……啊，风变凉了。晚霞的颜色，好厉害啊。"
    note: "开启黄昏滤镜 dusk，透仰望天边"
  - speaker: "小糸"
    charLabel: "koito"
    emotion: "shy"
    text: "わ、わっ！ 透ちゃん、立ち止まったら皆に遅れちゃいますよぉ……！"
    zh: "哇、哇！透，要是停下来的话会落大家一截的啦……！"
    note: "小糸小跑跟上"
  - speaker: "円香"
    charLabel: "madoka"
    emotion: "sigh"
    text: "別に急ぐ必要もないでしょう、小糸。……空が赤いのも、いつものことだし"
    zh: "也不用特意赶时间吧，小糸。……天空泛红什么的，本来也是常有的事。"
    note: "圆香平静接话"
  - speaker: "小糸"
    charLabel: "koito"
    emotion: "joy"
    text: "えへへ、そうだよね！ 円香ちゃんも一緒に並んで歩こうよ、雛菜ちゃんも来てくれるし！"
    zh: "诶嘿嘿，也是呢！圆香也一起并肩走吧，雏菜马上也要过来了！"
    note: "小糸开心地张望"
  - speaker: "雛菜"
    charLabel: "hinana"
    emotion: "idol"
    text: "お待たせ〜！ 小糸ちゃんたち、すっごく絵になる風景の中にいるね〜♪"
    zh: "久等啦～！小糸你们，正站在像画一样的风景里呢～♪"
    note: "第四位成员雏菜发言，触发自动 3 人上限分镜切机位"
  - speaker: "雛菜"
    charLabel: "hinana"
    emotion: "joy"
    text: "やっぱみんなで帰るの、しあわせ〜！ ねぇ、透先輩、コンビニ寄ってく〜？"
    zh: "果然大家一起回家好幸福呀～！呐，透前辈，待会顺路去便利店吗～？"
    note: "雏菜笑眯眯邀约"
  - speaker: "透"
    charLabel: "tooru"
    emotion: "joy"
    text: "いいね。じゃあ、冷たいやつ買おっか。みんなもそれでいい？"
    zh: "不错啊。那去买冰饮吧。大家都没意见？"
    note: "透转回镜头，自动切回第一机位"
  - speaker: "円香"
    charLabel: "madoka"
    emotion: "calm"
    text: "（……騒がしくて、落ち着かない人たち。……でも、この色だけは嘘じゃない）"
    zh: "（……真是吵闹又让人静不下来的一群人。……但唯有眼前的暮色，并非虚假。）"
    note: "圆香心中独白，闭口帧表现"
  - speaker: "小糸"
    charLabel: "koito"
    emotion: "joy"
    text: "はいっ！ 小糸、あたたかいココアにしようかな……それとも冷たいの！"
    zh: "嗯！小糸要不要选热可可呢……还是也选冰饮好呢！"
    note: "福丸小糸元气收尾（保留“小糸”）"
