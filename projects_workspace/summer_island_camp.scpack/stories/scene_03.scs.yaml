# 第 3 幕 · 事务所的说漏嘴危机
id: scene_03
title: "第 3 幕 · 事务所的说漏嘴危机"
bg: "00001"
bgm: "002"
cast: ["asahi", "fuyuko", "mei", "amana"]
lines:
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "joy"
    text: "あ、みんなにプロデューサーさん！おかえり～☆"
    zh: "啊，大家还有制作人先生！欢迎回来～☆"
    note: "[刚进事务所玄关，甘奈迈着轻快的步子小跑迎了上来，笑容明亮]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "joy"
    text: "おっ、甘奈ちゃん！ただいま～！"
    zh: "哦，甘奈！我们回来啦～！"
    note: "[爱依爽朗地挥了挥手，肩上还背着外出的背包]"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "joy"
    text: "甘奈ちゃん！あれ、もう昼っすか？"
    zh: "甘奈！咦，已经到中午了吗？"
    note: "[朝日歪头看了看事务所墙上的挂钟，一副刚睡饱的轻松神态]"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "surp"
    text: "えっ、お昼だよ？みんな昨日もずっと事務所にいなかったよね？"
    zh: "哎，已经是中午啦？大家昨天一整天也都不在事务所里吧？"
    note: "[甘奈眨了眨眼，带着关切望向迷光三人与制作人]"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "joy"
    text: "どこに行ってたのかなーって、甘奈ちょっと気になってたんだ☆"
    zh: "甘奈还有点在意，大家昨天到底去哪里了呢☆"
    note: "[甘奈歪过头，双手轻合在身前，毫无防备地追问]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "shy"
    text: "えっ……あ、あはは……昨日はその、ちょっとした用事よ"
    zh: "哎……啊、哈哈……昨天那个，只是有点小事啦。"
    note: "[清晨同室的尴尬余韵瞬间涌上心头，冬优子嘴角微微抽动着避开视线]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "shy"
    text: "そ、そうそう！うちらちょっと出かけてただけってかさー"
    zh: "对、对对！我们只是稍微出去转了转什么的啦——"
    note: "[爱依也跟着僵硬地摆手，眼神不自觉地往制作人那边瞥了一瞬]"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "surp"
    text: "うーん？ふゆちゃんも愛依ちゃんも、なんか様子が変だよ？"
    zh: "唔～？冬优酱和爱依酱，总觉得你们样子怪怪的哦？"
    note: "[甘奈敏锐地察觉到空气不对劲，微微倾身仔细端详两人的表情]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "idol"
    text: "変なことないわ♡　ふゆたち、ただ休んでただけよ"
    zh: "才没有奇怪呢♡ 冬优我们只是好好休了个假而已嘛。"
    note: "[冬优子迅速切换出完美甜美的“ふゆ”营业微笑，试图用气场把话题盖过去]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "shy"
    text: "あはは……！ほら、いい天気だったし、ね？"
    zh: "啊哈哈……！你看，昨天天气也挺好的嘛，对吧？"
    note: "[爱依干笑着附和，悄悄用胳膊肘碰了碰旁边的制作人求助]"
  - speaker: "プロデューサー"
    emotion: "joy"
    text: "えっ、ああ……まあ、ちょっとバタバタしてな"
    zh: "呃、嗯……算是吧，稍微有点手忙脚乱的。"
    note: "[制作人咳嗽了一声，伸手摸了摸后颈，语气莫名含糊]"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "serious"
    text: "プロデューサーさ���まで目が泳いでる……！"
    zh: "连制作人先生眼神都在飘忽……！"
    note: "[甘奈睁大眼睛，视线在冬优子、爱依和制作人之间来回扫视]"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "joy"
    text: "まさか、みんなして甘奈に何か隠してるんじゃ……"
    zh: "难道说，大家联起手来在瞒着甘奈什么事吗……？"
    note: "[甘奈微微鼓起脸颊，半信半疑地往前凑近了半步]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "surp"
    text: "ちっ、違うわよ！隠してなんか───"
    zh: "才、才没有呢！哪有什么瞒着的───"
    note: "[冬优子的营业面具出现裂痕，耳根微红，急切地想开口否认]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "shy"
    text: "ほんとだって！変なことじゃないっしょ……えっと！"
    zh: "真的啦！又不是什么见不得人的事……呃那个！"
    note: "[爱依越描越黑，急得直挠头，一时半会儿憋不出合适的借口]"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "joy"
    text: "んー？隠してないっすよ。ただ山に行っただけ"
    zh: "嗯—？没瞒着呀。只是去爬山了而已。"
    note: "[看着几人支支吾吾半天，旁边的朝日一脸坦然地插话]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "surp"
    text: "ちょっ、あさひちゃん！？"
    zh: "等、朝日酱！？"
    note: "[冬优子瞳孔猛地一缩，刚想伸手捂住朝日的嘴却慢了一拍]"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "joy"
    text: "旅館でプロデューサーさんと同じ部屋で寝たっす！"
    zh: "然后在旅馆里和制作人先生睡在同一个房间啦！"
    note: "[朝日毫无防备地把重点全盘托出，语气甚至还有点像在分享郊游见闻]"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "surp"
    text: "ええっ！？　りょ、旅館で同じ部屋！？"
    zh: "哎哎！？在、在旅馆里同一个房间！？"
    note: "[甘奈震惊得整个人往后仰了一下，声音陡然拔高]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "surp"
    text: "あーっ！！あさひちゃん、言い方ぁーっ！！"
    zh: "啊——！！朝日酱，你这说法也太让人误会了吧——！！"
    note: "[爱依脸色爆红，慌忙扑上前一把搂住朝日的肩膀试图打断]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "joy"
    text: "もう、あさひちゃん！誤解される言い方しないでよ！"
    zh: "真是的，朝日酱！别用那种容易让人误会的说法啊！"
    note: "[冬优子彻底破功，整张脸涨得通红，急忙抓住朝日的另一只手臂]"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "surp"
    text: "えっ、違うっすか？みんなで雑魚寝したのに"
    zh: "咦，不对吗？大家明明就是铺开被褥睡在一起的啊。"
    note: "[朝日被左右拉扯着，依然一头雾水地眨了眨眼睛]"
  - speaker: "プロデューサー"
    emotion: "joy"
    text: "待ってくれ、甘奈！これにはちゃんとした理由があってな"
    zh: "等等，甘奈！这件事其实是有正经原因的。"
    note: "[制作人赶紧上前一步摆手稳住场面，神色认真地接过话头]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "serious"
    text: "そうよ！山であさひちゃんが転んで足を挫いたの！"
    zh: "没错！是朝日酱在山上摔倒把脚崴了！"
    note: "[冬优子深吸一口气稳住阵脚，语速飞快地把事故起因交代出来]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "serious"
    text: "暗くなってバス逃して、部屋も一室だけだったんだよね～"
    zh: "天黑下来山后末班车也没了，旅馆又刚好只剩下一间空房了嘛～"
    note: "[爱依顺势紧跟着把下山后的窘境补充完整，语气急切又诚恳]"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "shy"
    text: "えへへ、競争で走りすぎたっす。気をつけるっす"
    zh: "嘿嘿，赛跑的时候冲太快了。以后会注意的。"
    note: "[朝日不好意思地挠了挠脸颊，老老实实承认了自己贪跑惹出的祸]"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "serious"
    text: "あさひちゃん、足を挫いたの！？……それなら仕方ないよね"
    zh: "朝日酱，你崴到脚了吗！？……如果是那样的话，确实也没办法呢。"
    note: "[听清前因后果，甘奈先是紧张地看向朝日的脚踝，随即恍然大悟]"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "sad"
    text: "びっくりしちゃったよ……怪我が軽くってよかった"
    zh: "真是吓了甘奈一跳呢……幸好伤得不重。"
    note: "[甘奈轻轻拍了拍胸口，悬着的一颗心终于落了下来，露出温柔的后怕神色]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "serious"
    text: "ほら、あんたも言いなさい。心配かけたんだから"
    zh: "喂，你也说两句啊。害人家跟着担心了。"
    note: "[冬优子松了口气，顺势斜睨向一旁的制作人催促道]"
  - speaker: "プロデューサー"
    emotion: "joy"
    text: "悪いな、甘奈。今度から連絡ももっと徹底するよ"
    zh: "抱歉啊，甘奈。下次我也会把联络工作做得更到位的。"
    note: "[制作人苦笑着点点头，诚恳地向甘奈致歉]"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "joy"
    text: "ううん、無事で安心した☆　あさひちゃん、お大事にね！"
    zh: "没关系，大家平安无事我就放心啦☆ 朝日酱，脚伤要好好保重哦！"
    note: "[甘奈重新绽放出灿烂的笑容，暖心地叮嘱着朝日，事务所恢复了往常的明快气氛]"
