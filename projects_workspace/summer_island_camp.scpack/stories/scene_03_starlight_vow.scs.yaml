  - speaker: "プロデューサー"
    emotion: "serious"
    text: "（伙伴们带着慰问点心登上天台——みんなの様子を確かめながら、声をかけた）"
    zh: "（伙伴们带着慰问点心登上天台——一边确认大家的状态，一边上前搭话）"
    note: "[小段 1: 伙伴们带着慰问点心登上天台] [镜头A] 伙伴们推门登上天台，带来热腾腾的慰问点心"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "joy"
    text: "プロデューサーさん、ふゆもみんなと一緒に、この瞬間を大切にしたいです！"
    zh: "制作人先生，我也想和大家一起珍惜这个闪耀的瞬间！"
  - speaker: "円香"
    charLabel: "madoka"
    emotion: "joy"
    text: "プロデューサー、私もみんなと一緒に、この瞬間を大切にしたいです！"
    zh: "制作人，我也想和大家一起珍惜这个闪耀的瞬间！"
  - speaker: "甘奈"
    charLabel: "amana"
    emotion: "joy"
    text: "プロデューサーさん、見て見て☆ 海がすっごく綺麗だよ！甘奈、みんなと来られて超嬉しいな♪"
    zh: "制作人先生，快看快看☆ 大海超级漂亮哦！甘奈能和大家一起来，超开心的♪"
  - speaker: "甜花"
    charLabel: "tenka"
    emotion: "joy"
    text: "にへへ……プロデューサーさんも、なーちゃんも一緒なら……甜花、外でもちょっとだけ頑張れる、かも……。"
    zh: "嘿嘿……只要制作人先生和甘奈酱在一起……甜花在外面也能稍微努力一下下，大概……。"
    note: "[小段 2: 轮流说出公演目标与欢声笑语] [镜头B] 全员轮流说出对下一次公演的目标，笑声回荡在夜空"
  - speaker: "羽那"
    charLabel: "hana"
