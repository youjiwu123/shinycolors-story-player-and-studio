# 第 2 幕 · 旅馆同室的清晨
id: scene_02
title: "第 2 幕 · 旅馆同室的清晨"
bg: "00230"
bgm: "034"
cast: ["asahi", "fuyuko", "mei"]
lines:
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "joy"
    text: "んぅ……朝かぁ。……って、あれ？"
    zh: "嗯唔……早上了呀。……咦，等等？"
    note: "[揉着眼睛从被子里坐起身，视线迷糊地扫过陌生的和室]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "surp"
    text: "えっ、ちょっと待って……プロデューサー！？"
    zh: "哎，等一下……制作人！？"
    note: "[看清门口角落的被褥后猛地捂住嘴，压低声音惊呼]"
  - speaker: "プロデューサー"
    emotion: "joy"
    text: "ん……おはよう、愛依。もうそんな時間か。"
    zh: "嗯……早啊，爱依。已经这个时间了吗。"
    note: "[听到动静后睁开眼，靠墙坐起身揉了揉后颈]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "shy"
    text: "お、おはよ……ってか、えっと、その……！"
    zh: "早、早安……那个，不对，就是……！"
    note: "[视线慌乱地飘向天花板，平时爽朗的语气一下结巴起来]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "shy"
    text: "同じ部屋って、朝になるとマジでヤバくない！？"
    zh: "同住一间房这种事，一到早上岂不是超不妙的吗！？"
    note: "[抱着膝盖缩在被窝里，脸颊一下红透]"
  - speaker: "プロデューサー"
    emotion: "joy"
    text: "あぁ……部屋が一つしか空いてなかったからな。"
    zh: "啊……毕竟昨晚旅馆只剩这一间空房了。"
    note: "[略显局促地抓了抓头发，目光礼貌地移开]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "shy"
    text: "そ、そりゃそうなんだけどさぁ……うぅっ！"
    zh: "话、话是这么说没错啦……呜呜！"
    note: "[把被子往上拉到鼻尖，只露出一双眼睛眨呀眨]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "shy"
    text: "なんでもないっ！……いや、ちょっと照れるじゃん！"
    zh: "没什么啦！……不对，果然还是会有点害羞嘛！"
    note: "[嘴硬完又忍不住闷声补了一句真心话]"
  - speaker: "プロデューサー"
    emotion: "joy"
    text: "はは……入口側の隅っこにいたから勘弁してくれ。"
    zh: "哈哈……我一直老实待在门口最角落里，就饶了我吧。"
    note: "[苦笑着拍了拍离她们最远的门边被褥]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "surp"
    text: "んっ……朝から何騒いでるのよ……"
    zh: "嗯……大清早的吵什么呀……"
    note: "[旁边的被窝动了动，冬优子带着早起的鼻音支起身]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "shy"
    text: "あっ、冬優子ちゃん！ おはよ……"
    zh: "啊，冬优子！早安……"
    note: "[立刻放下被子小声回应，眼神还往门口方向瞄]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "surp"
    text: "おはよう愛依ちゃん……って、へっ！？"
    zh: "早安爱依……不对，咦！？"
    note: "[顺着爱依的视线看去，整个人在看到制作人的瞬间僵住]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "shy"
    text: "あ、あんた……なんでここにいるのよ！？"
    zh: "你、你这家伙……怎么会在这里啊！？"
    note: "[耳根瞬间通红，反射性扯紧衣领指向制作人]"
  - speaker: "プロデューサー"
    emotion: "joy"
    text: "いや、昨日みんなでここに泊まっただろ。"
    zh: "不是，昨晚大家不是一起住在这儿的吗。"
    note: "[有些无奈地提醒她昨晚的状况]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "joy"
    text: "そ、そうだったわね！ 緊急避難よ、緊急避難！"
    zh: "对、对哦！这是紧急避险，紧急避险！"
    note: "[像是要说服自己一般连连点头，强行端起架子]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "joy"
    text: "愛依ちゃんも変なこと考えないの！"
    zh: "爱依你也别胡思乱想！"
    note: "[转头严肃地提醒爱依，却掩不住微微发烫的脸颊]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "shy"
    text: "う、うちは何も考えてないっしょ……たぶん。"
    zh: "我、我才没有乱想吧……大概。"
    note: "[眼神心虚地游移了一瞬，小声咕哝]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "shy"
    text: "ふゆだって別に気にしてなんか……っ"
    zh: "冬优也根本没有在在意这种事……唔"
    note: "[别过脸不去看制作人，手忙脚乱地捋顺睡乱的头发]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "serious"
    text: "───とにかく、顔くらい先に洗ってきなさいよ！"
    zh: "───总之，你先出去洗把脸好不好！"
    note: "[顺手整理好领口，硬着头皮把制作人往门外赶]"
  - speaker: "プロデューサー"
    emotion: "joy"
    text: "わ、わかった。すぐ戻るから支度しておいてくれ。"
    zh: "好、好的。我一会儿回来，你们先收拾准备一下。"
    note: "[识趣地起身拎起洗漱包，拉开门退到走廊去]"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "joy"
    text: "んー……よく寝たー！ もう朝っすか？"
    zh: "嗯——睡得好香啊！已经早上了吗？"
    note: "[最里侧的朝日猛地掀开被子坐起来，元气满满地伸了个懒腰]"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "joy"
    text: "あっ、足首も昨日より全然平気みたい！"
    zh: "啊，脚踝好像也比昨天好多了！"
    note: "[坐在被褥上轻轻转了转昨天崴伤的脚踝，眼睛亮晶晶的]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "joy"
    text: "おっ、マジで？ そりゃよかったじゃん～！"
    zh: "哦，真的假的？那太好了嘛～！"
    note: "[看到朝日精神十足的样子，紧张感总算散去些许]"
  - speaker: "あさひ"
    charLabel: "asahi"
    emotion: "joy"
    text: "みんなで布団並べて、キャンプみたいっすね！"
    zh: "大家把被褥排成一排，就像去露营一样呢！"
    note: "[环顾并排的地铺开心地笑起来，丝毫没察觉屋里刚刚的窘迫]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "sad"
    text: "……キャンプなわけないでしょ、あさひちゃん。"
    zh: "……怎么可能是露营啊，朝日。"
    note: "[扶着额头叹了口气，一时竟不知该从何吐槽]"
  - speaker: "プロデューサー"
    emotion: "joy"
    text: "みんな、そろそろチェックアウトの時間だぞ。"
    zh: "大家准备好了吗，差不多到退房时间了。"
    note: "[拉开门缝从走廊探进声音，提醒众人该出发回事务所了]"
  - speaker: "愛依"
    charLabel: "mei"
    emotion: "surp"
    text: "うわっ、ほんとだ！ 早く荷物まとめなきゃ！"
    zh: "哇，真的耶！得赶紧收拾行李才行！"
    note: "[看了眼时间后慌忙抓起背包，想尽快离开这个尴尬的房间]"
  - speaker: "冬優子"
    charLabel: "fuyuko"
    emotion: "serious"
    text: "ほら、事務所戻るわよ。さっさと出るわ！"
    zh: "快点，要回事务所了。麻利点出门吧！"
    note: "[最后理了理裙摆，硬着头皮催促两人跟自己赶紧走出房间]"
